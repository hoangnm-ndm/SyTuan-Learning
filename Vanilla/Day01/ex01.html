<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./ex02.css" />
  </head>
  <body>
    <!-- HTML = HyperText Markup Language -->
    <!-- h1 = heading level 1 -->
    <h1>Noi dung the h1</h1>
    <!-- paragraph -->
    <p>
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Labore,
      perferendis necessitatibus. Quam inventore facere accusamus eos sint quasi
      exercitationem molestias! Perspiciatis iste recusandae enim ex minima
      laudantium delectus, ratione possimus.
    </p>

    <img src="./" alt="" />
    <!-- anchor -->
    <a href="https://codefarm.edu.vn">codefarm</a>
    <!-- HTML Semantic: Luôn cố gắng làm rõ nghĩa của nội dung -->
    <!-- HTML Non-semantic: div, span - dùng vì chức năng chung, không bổ sung nghĩa cho nội dung -->
    <header></header>

    <main>
      <sidebar></sidebar>
      <section>
        <h2></h2>
      </section>
      <section>
        <ul>
          <!-- ul - unordered -->
          <!-- ol - ordered -->
          <li></li>
          <!-- list item -->
        </ul>

        <div>
          <!-- division - phân chia -->
        </div>

        <table>
          <thead>
            <tr>
              <!-- table row -->
              <th>
                <!-- table heading -->
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <!-- table data -->
              </td>
            </tr>
          </tbody>
          <tfoot></tfoot>
        </table>
      </section>

      <form action=""></form>
    </main>

    <footer></footer>
  </body>
</html>
