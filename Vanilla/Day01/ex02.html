<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="ex02.css" />
    <style>
      /* Cach 2: CSS Internal */
      /* CSS Selctor = là cách để chọn 1 phần tử HTML và tạo kiểu cho nó */

      p {
        color: white;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <h2>Noi dung the h2</h2>
    <div>
      <!-- CSS = Cascading Style Sheet = Ngôn ngữ tạo kiểu xếp chồng -->
      <!-- Cach 1: CSS Inline -->
      <p style="background-color: red">noi dung doan van</p>

      <p style="color: green">Lorem ipsum dolor sit.</p>
      <p id="param" class="title">Lorem ipsum dolor sit.</p>

      <img src="./image.png" alt="" width="300px" />
      <!-- self-closing tag -->
    </div>
  </body>
</html>
